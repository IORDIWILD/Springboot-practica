<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Actualizar Reseña</title>
</head>
<body>

<h1>Actualizar Reseña</h1>
<a href="http://localhost:8080/resenas">Volver al Menú de Reseñas</a>
<hr>

<form th:action="@{actualizar/guardar}" th:object="${resena}" method="post">
    <input type="hidden" name="_method" value="PUT">

    <label for="id">ID de la Reseña</label>
    <input type="number" id="id" name="id" required>
    <br>

    <label for="calificacion">Calificación (1-5)</label>
    <input type="number" id="calificacion" th:field="*{calificacion}" min="1" max="5">
    <br>

    <label for="comentario">Comentario</label>
    <input type="text" id="comentario" th:field="*{comentario}">
    <br>

    <label for="fecha">Fecha (yyyy-MM-dd)</label>
    <input type="text" id="fecha" th:field="*{fecha}" placeholder="2026-08-30">
    <br>

    <button type="submit">Actualizar Reseña</button>
</form>

</body>
</html>
