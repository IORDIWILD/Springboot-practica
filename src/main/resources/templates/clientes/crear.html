<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Crear Cliente</title>
</head>
<body>
<h1>Agregar nuevo Cliente</h1>
<a href="http://localhost:8080/clientes">Volver al Menu de Clientes</a>

<hr>
<form th:action="@{crear/guardar}" th:object="${cliente}" method="post">
        <label for="nombre">Nombre</label>
        <input type ="text" id="nombre" th:field="*{nombre}" required>
    <br>
        <label for="email">Email</label>
        <input type ="text" id="email" th:field="*{email}" required>
    <br>
        <label for="ciudad">Ciudad</label>
        <input type ="text" id="ciudad" th:field="*{ciudad}" required>
    <br>
        <label for="fecha">Fecha de Registro</label>
        <input type ="text" id="fecha" th:field="*{fechaRegistro}" required>
    <br>
        <label for="telefono">Telefono</label>
        <input type ="text" id="telefono" th:field="*{telefono}" required>
    <br>
    <button type="submit">Guardar Cliente</button>
</form>

</body>
</html>
