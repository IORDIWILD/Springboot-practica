<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Actualizar Cliente</title>
</head>
<body>

<h1>Actualizar Cliente</h1>
<a href="http://localhost:8080/">Volver al Menú</a>
<hr>

<form action="#" th:action="@{actualizar/guardar}" th:object="${cliente}" method="post">
    <input type="hidden" name="_method" value="PUT">
    <label for="id"> ID</label>
    <input type="number" id="id" name="id" required>
    <br>
    <label for="nombre">Nombre</label>
    <input type ="text" id="nombre" th:field="*{nombre}">
    <br>
    <label for="email">Email</label>
    <input type ="text" id="email" th:field="*{email}">
    <br>
    <label for="ciudad">Ciudad</label>
    <input type ="text" id="ciudad" th:field="*{ciudad}">
    <br>
    <label for="fecha">Fecha de Registro</label>
    <input type ="text" id="fecha" th:field="*{fechaRegistro}">
    <br>
    <label for="telefono">Telefono</label>
    <input type ="text" id="telefono" th:field="*{telefono}">
    <br>
    <button type="submit">Actualizar Cliente</button>
</form>

</body>
</html>
