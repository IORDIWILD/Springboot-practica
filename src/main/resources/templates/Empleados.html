<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:insert="~{fragments::header('Empleados')}">
        <link rel="stylesheet" th:href="@{/Empleados.css}"/>
</head>
<body>
<h1>Empleados</h1>

<a href="http://localhost:8080/">Volver al Menú</a>
<button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#modalDeCrearEmpleado">
    Crear Empleado
</button>

<!-- modal de Crear -->
<div class="modal fade" id="modalDeCrearEmpleado" tabindex="-1" aria-labelledby="modalCrearEmpleadoLabel" aria-hidden="true">
    <div class="modal-dialog modal-sm">
        <div class="modal-content">
            <div class="modal-header">
                <h1 id="modalCrearEmpleadoLabel">Crear Empleado</h1>
            </div>
            <form th:action="@{/empleados/Crear}" method="post" th:object="${empleado}">
                <div class="modal-body">

                    <div class="row mb-3">
                        <div class="col-md-4">
                            <label for="nombre" class="col-form-label">Nombre</label>
                        </div>
                        <div class="col-md-8">
                            <input type="text" id="nombre" class="form-control" th:field="*{nombre}" required>
                        </div>
                    </div>


                    <div class="row mb-3">
                        <div class="col-md-4">
                            <label for="puesto" class="col-form-label">Puesto</label>
                        </div>
                        <div class="col-md-8">
                            <input type="text" id="puesto" class="form-control" th:field="*{puesto}" required>
                        </div>
                    </div>


                    <div class="row mb-3">
                        <div class="col-md-4">
                            <label for="salario" class="col-form-label">Salario</label>
                        </div>
                        <div class="col-md-8">
                            <input type="number" step="0.01" id="salario" class="form-control" th:field="*{salario}" required>
                        </div>
                    </div>


                    <div class="row mb-3">
                        <div class="col-md-4">
                            <label for="jefe" class="col-form-label">ID del Jefe</label>
                        </div>
                        <div class="col-md-8">
                            <select id="jefe" class="form-select" th:field="*{jefeId}" required>
                                <option value="">Sin jefe</option>
                                <option th:each="em : ${empleados}" th:value="${em.idEmpleado}" th:text="${em.nombre}"></option>
                            </select>
                        </div>
                    </div>

                    <div class="row mb-3">
                        <div class="col-md-4">
                            <label for="fecha" class="col-form-label">Fecha Contratación</label>
                        </div>
                        <div class="col-md-8">
                            <input type="date" id="fecha" class="form-control" th:field="*{fechaContratacion}" required>
                        </div>
                    </div>

                </div>
                <div class="modal-footer">
                    <button type="submit" class="btn btn-primary">Crear Empleado</button>
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- modal de Modificar -->
<div class="modal fade" th:each="emp : ${empleados}"
     th:id="'modalModificarEmpleado_' + ${emp.idEmpleado}"
     tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-sm">
        <div class="modal-content">
            <div class="modal-header">
                <h1 class="modal-title">Modificar Empleado: <span th:text="${emp.nombre}"></span></h1>
            </div>


            <form th:action="@{/empleados/Modificar/{id}(id=${emp.idEmpleado})}" method="post">
                <div class="modal-body">
                    <div class="row mb-3">
                        <div class="col-md-4"><label class="col-form-label">Nombre</label></div>
                        <div class="col-md-8">
                            <input type="text" name="nombre" class="form-control"
                                   th:value="${emp.nombre}" required>
                        </div>
                    </div>

                    <div class="row mb-3">
                        <div class="col-md-4"><label class="col-form-label">Puesto</label></div>
                        <div class="col-md-8">
                            <input type="text" name="puesto" class="form-control"
                                   th:value="${emp.puesto}" required>
                        </div>
                    </div>

                    <div class="row mb-3">
                        <div class="col-md-4"><label class="col-form-label">Salario</label></div>
                        <div class="col-md-8">
                            <input type="number" step="0.01" name="salario" class="form-control"
                                   th:value="${emp.salario}" required>
                        </div>
                    </div>

                    <div class="row mb-3">
                        <div class="col-md-4"><label class="col-form-label">ID del Jefe</label></div>
                        <div class="col-md-8">
                            <select name="jefeId" class="form-select">
                                <option value="">Sin jefe</option>
                                <option th:each="em : ${empleados}"
                                        th:value="${em.idEmpleado}"
                                        th:text="${em.nombre}"
                                        th:selected="${em.idEmpleado == emp.getJefeId()}"></option>
                            </select>
                        </div>
                    </div>

                    <div class="row mb-3">
                        <div class="col-md-4"><label class="col-form-label">Fecha Contratación</label></div>
                        <div class="col-md-8">
                            <input type="date" name="fechaContratacion" class="form-control"
                                   th:value="${emp.fechaContratacion}" required>
                        </div>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary">Actualizar Empleado</button>
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
            </form>
        </div>
    </div>
</div>


            <div class="row col-md-6 border text-center bg-dark text-light fw-bold border-bottom">
                <div class="col">ID</div>
                <div class="col">Nombre</div>
                <div class="col">Puesto</div>
                <div class="col">Salario</div>
                <div class="col">Jefe ID</div>
                <div class="col">Fecha de Contratación</div>
                <div class="col">Acciones</div>
            </div>

<div class="row col-md-6 border text-center align-items-center contenido etiqueta" th:each="empleado : ${empleados}">
            <div th:if="${empleados.isEmpty()}" class="text-warning">No se ha encontrado ningun empleado</div>
                <div class="col">
                    <span th:text="${empleado.idEmpleado}"></span>
                </div>
                <div class="col">
                    <span th:text="${empleado.nombre}"></span>
                </div>
                <div class="col">
                    <span th:text="${empleado.puesto}"></span>
                </div>
                <div class="col">
                    <span th:text="${empleado.salario}"></span>
                </div>
                <div class="col">
                    <span th:text="${empleado.jefe?.idEmpleado}"></span>
                </div>
                <div class="col">
                    <span th:text="${empleado.fechaContratacion}"></span>
                </div>
                <div class="col">
                    <a class="btn btn-light"
                       th:href="@{/NEmpleados/Modificar/{id}(id=${empleado.idEmpleado})}"
                       data-bs-toggle="modal"
                       th:data-bs-target="'#modalModificarEmpleado_' + ${empleado.idEmpleado}">
                        Modificar
                    </a>
                    <a class="btn btn-light text-warning"
                       th:href="@{/NEmpleados/Borrar/{id}(id=${empleado.idEmpleado})}">
                        Borrar
                    </a>
                </div>
            </div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
