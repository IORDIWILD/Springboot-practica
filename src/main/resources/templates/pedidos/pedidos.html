<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Menú Pedidos</title>
</head>
<body>

<h1>Pedidos</h1>
<a href="http://localhost:8080/">Volver al Menú</a>

<form action="#" th:action="@{/pedidos/buscar}" method="get">
    <label for="id">Buscar por ID:</label>
    <input type="number" id="id" name="id" required>
    <button type="submit">Buscar</button>
</form>

<a href="/pedidos/listar">Ver todos los Pedidos</a>
<a href="/pedidos/crear">Nuevo Pedido</a>
<a href="/pedidos/actualizar">Actualizar Pedido</a>
<a href="/pedidos/borrar">Borrar Pedido</a>

<table border="1" th:if="${pedidos != null and !pedidos.isEmpty()}">
    <thead>
    <tr>
        <th>ID</th>
        <th>Cliente</th>
        <th>Empleado</th>
        <th>Fecha Pedido</th>
        <th>Estado</th>
        <th>Total</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="pedido : ${pedidos}">
        <td th:text="${pedido.idPedido}"></td>
        <td th:text="${pedido.cliente != null ? pedido.cliente.nombre : 'Sin cliente'}"></td>
        <td th:text="${pedido.empleado != null ? pedido.empleado.nombre : 'Sin empleado'}"></td>
        <td th:text="${pedido.fechaPedido}"></td>
        <td th:text="${pedido.estado}"></td>
        <td th:text="${pedido.total != null ? pedido.total : '0.00'}"></td>
    </tr>
    </tbody>
</table>

</body>
</html>
