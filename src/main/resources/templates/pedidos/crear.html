<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Crear Pedido</title>
</head>
<body>

<h1>Agregar nuevo Pedido</h1>
<a href="http://localhost:8080/pedidos">Volver al Menú de Pedidos</a>
<hr>

<form th:action="@{crear/guardar}" th:object="${pedido}" method="post">
    <label for="idCliente">ID Cliente</label>
    <input type="number" id="idCliente" th:field="*{idCliente}" required>
    <br>

    <label for="idEmpleado">ID Empleado (opcional)</label>
    <input type="number" id="idEmpleado" th:field="*{idEmpleado}">
    <br>

    <label for="fechaPedido">Fecha Pedido (yyyy-MM-dd)</label>
    <input type="text" id="fechaPedido" th:field="*{fechaPedido}" placeholder="2026-08-30" required>
    <br>

    <label for="estado">Estado</label>
    <select id="estado" th:field="*{estado}">
        <option value="pendiente">Pendiente</option>
        <option value="enviado">Enviado</option>
        <option value="entregado">Entregado</option>
        <option value="cancelado">Cancelado</option>
    </select>
    <br>

    <button type="submit">Crear Pedido</button>
</form>

</body>
</html>
